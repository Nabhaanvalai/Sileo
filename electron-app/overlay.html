<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sileo Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  height: 46px;
  width: 110px;
}

/* ── Glassmorphism pill ───────────────────────────────────────── */
.pill {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  height: 100%;

  /* Glass layers */
  background: rgba(12, 12, 14, 0.72);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);

  /* Subtle top-edge highlight like Apple Dynamic Island */
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-top: none;
  border-radius: 0 0 20px 20px;

  /* Depth shadow */
  box-shadow:
    0 4px 24px rgba(0, 0, 0, 0.55),
    0 1px 0   rgba(255, 255, 255, 0.06) inset;

  animation: pillIn 0.28s cubic-bezier(0.34, 1.46, 0.64, 1) both;
}

@keyframes pillIn {
  from { transform: translateY(-100%); opacity: 0; }
  to   { transform: translateY(0);     opacity: 1; }
}

/* ── Cancel button ────────────────────────────────────────────── */
.cancel-btn {
  background: rgba(255, 59, 48, 0.85);
  border: none;
  cursor: pointer;
  color: #fff;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s, transform 0.12s;
  flex-shrink: 0;
}
.cancel-btn:hover  { opacity: 0.82; transform: scale(1.08); }
.cancel-btn svg    { width: 7px; height: 7px; }

/* ── Waveform bars ────────────────────────────────────────────── */
.bars {
  display: flex;
  gap: 2px;
  align-items: center;
  height: 20px;
}
.bars span {
  display: block;
  width: 2.5px;
  height: 3px;
  border-radius: 2px;
  /* Warm accent matching the app palette */
  background: rgba(200, 169, 126, 0.90);
  transition: height 0.07s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Spinner (processing state) ───────────────────────────────── */
.spinner {
  display: none;
  width: 15px; height: 15px;
  border: 1.8px solid rgba(255,255,255,0.18);
  border-top-color: rgba(200, 169, 126, 0.9);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
.processing .spinner    { display: block; }
.processing .bars,
.processing .cancel-btn { display: none; }

/* Status label (shown in processing/done/error) */
.status-txt {
  display: none;
  color: rgba(255,255,255,0.72);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.3px;
  white-space: nowrap;
  max-width: 68px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.processing .status-txt { display: block; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Done flash ───────────────────────────────────────────────── */
.done .bars, .done .cancel-btn { display: none; }
.done .spinner { display: none; }
.done .status-txt {
  display: block;
  color: rgba(100, 210, 140, 0.9);
}

/* ── Error state ──────────────────────────────────────────────── */
.error .bars, .error .cancel-btn { display: none; }
.error .spinner { display: none; }
.error .status-txt {
  display: block;
  color: rgba(255, 100, 90, 0.9);
  font-size: 9.5px;
}
</style>
</head>
<body>
<div class="pill recording" id="pill">

  <div class="bars" id="bars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="spinner" id="spinner"></div>
  <span class="status-txt" id="status-txt"></span>

  <button class="cancel-btn" id="cancel-btn" title="Stop">
    <svg viewBox="0 0 14 14" fill="currentColor">
      <rect x="2" y="2" width="10" height="10" rx="1"></rect>
    </svg>
  </button>

</div>
<script src="overlay-renderer.js"></script>
</body>
</html>
