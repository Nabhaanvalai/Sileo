<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sileo Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  font-family: -apple-system, 'Inter', sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 38px;
  width: 92px;
}

.pill {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: black;
  border-radius: 0 0 12px 12px;
  width: 100%;
  height: 100%;
  animation: pillIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes pillIn {
  from { transform: translateY(-100%); }
  to   { transform: translateY(0); }
}

/* Stop button */
.cancel-btn {
  background: rgba(255, 59, 48, 0.92);
  border: none;
  cursor: pointer;
  color: white;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.cancel-btn:hover { opacity: 0.8; }
.cancel-btn svg { width: 7px; height: 7px; }

/* Waveform bars (shown while recording) */
.bars {
  display: flex;
  gap: 1.5px;
  align-items: center;
  height: 18px;
}
.bars span {
  display: block;
  width: 2px;
  height: 2px;
  border-radius: 2px;
  background: #C8A97E;
  transition: height 0.08s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Spinner (for processing) */
.spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid transparent;
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.processing .spinner { display: block; }
.processing .bars, .processing .cancel-btn { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="pill recording" id="pill">

  <div class="bars" id="bars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="spinner" id="spinner"></div>

  <button class="cancel-btn" id="cancel-btn" title="Stop">
    <svg viewBox="0 0 14 14" fill="currentColor">
      <rect x="2" y="2" width="10" height="10" rx="1"></rect>
    </svg>
  </button>

</div>
<script src="overlay-renderer.js"></script>
</body>
</html>
